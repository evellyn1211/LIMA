<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>
<body>
    

<!-- </UL> Como se fosse o bloco sde notas (quando é uma lista NÃO ordenada) -->
 <!-- <LI> </LI> Representa o iten dentro da lista -->

 <!-- ----- Lista NÃO ordenadas -->
  <ul>
<li>Salgadinho</li>
<li>Suco</li>
<li>Pipoca</li>
<li>Sucrilhos</li>
<li>Chocolate</li>
<li>Pão</li>
<li>Arroz</li>
<li>Bala</li>
</ul>

<!-- -------- LISTAS ORDENADAS --------- -->
 <ol>
    <li>Jonatas</li>
    <li>Gabriel</li></li>
    <li>Brayan</li>
</ol>

<!-- ------- LISTA ALINHADAS ------- -->
 <ul>

<li>Frutas</li>
<ul>
    <li>Maçã</li>
    <li>Limão</li>
    <li>Morango</li>
</ul>
    <li>Bebidas</li>
<ul>

    <li>coca-cola</li>
    <li>Água</li>
    <li>Monster</li>
</ul>
</ul>


</body>
</html>
